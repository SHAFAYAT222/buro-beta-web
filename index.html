<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <title>বুড়ো বেটা</title>
</head>
<body>
  <h2>বুড়ো বেটার সাথে কথা বলো</h2>
  <input type="text" id="userInput" placeholder="তুমি কী বলতে চাও?" />
  <button onclick="askBot()">জিজ্ঞেস করো</button>
  <p id="botReply">বুড়ো বেটা এখানেই উত্তর দেবে...</p>

  <script>
    function askBot() {
      const input = document.getElementById("userInput").value;

      fetch("https://hf.space/embed/shafayat222/buro-beta-bot/api/predict/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ data: [input] })
      })
      .then(res => res.json())
      .then(data => {
        document.getElementById("botReply").innerText = data.data[0];
      })
      .catch(error => {
        document.getElementById("botReply").innerText = "বুড়ো বেটা এখন ঘুমাচ্ছে বা নেট বন্ধ!";
        console.error("Error:", error);
      });
    }
  </script>
</body>
</html>
